<!DOCTYPE html>
<html lang="es">
<head th:replace="fragments/head :: head ('Cover Manager - Inicio')"></head>

<body>
<header th:replace="fragments/header :: header"></header>

<h1>Lista de Restaurantes</h1>

<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<table>
    <thead>
    <tr>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="restaurante : ${restaurantes}">
        <td th:text="${restaurante.nombre}"></td>
        <td th:text="${restaurante.direccion}"></td>
        <td>
            <a th:href="@{/restaurantes/edit(id=${restaurante.id})}">Editar</a>
            <!-- Formulario para eliminar el restaurante -->
            <form th:action="@{/restaurantes/delete}" method="post" style="display:inline;">
                <input type="hidden" name="id" th:value="${restaurante.id}" />
                <button type="submit">Eliminar</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<a href="/restaurantes/new">Agregar nuevo restaurante</a>
</body>
</html>
